name: Publish site and sync Flowwow catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync Flowwow catalog
        id: sync
        continue-on-error: true
        env:
          FLOWWOW_API_KEY: ${{ secrets.FLOWWOW_API_KEY }}
        run: python3 scripts/sync-flowwow.py

      - name: Save refreshed catalog
        if: steps.sync.outcome == 'success' && github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/catalog.json data/catalog.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/catalog.json data/catalog.js
            git commit -m "Refresh Flowwow catalog"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
